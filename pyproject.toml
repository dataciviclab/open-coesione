[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-open-coesione"
version = "0.1.0"
description = "OpenCoesione — dati coesione territoriale italiana"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyyaml>=6.0",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[tool.pytest.ini_options]
testpaths = ["tests", "dashboard/tests"]
markers = [
    "smoke: smoke test leggeri (config, SQL, struttura)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["dashboard", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[project.urls]
Home = "https://github.com/dataciviclab/open-coesione"

[tool.toolkit.extends]
source_id = "open-coesione"
