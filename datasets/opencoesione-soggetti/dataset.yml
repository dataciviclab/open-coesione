root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_soggetti"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, soggetti, beneficiari]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2007
    end_year: 2027

raw:
  sources:
    - name: "soggetti_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/soggetti_20260630.parquet"
        filename: "soggetti.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns:
    - COD_LOCALE_PROGETTO
    - OC_CODICE_FISCALE_SOGG
    - SOGG_DESCR_RUOLO
    - DESCR_FORMA_GIURIDICA_SOGG
    - COD_COMUNE_SEDE_SOGG
    - OC_COD_ENTE_BDAP
    - OC_COD_ENTE_IPA
  read:
    source: config_only
    mode: latest
  validate:
    not_null: [COD_LOCALE_PROGETTO, OC_CODICE_FISCALE_SOGG]
    min_rows: 1000000

mart:
  tables:
    - name: "mart_beneficiari"
      sql: "sql/mart_beneficiari.sql"
    - name: "mart_soggetti_ruolo"
      sql: "sql/mart_soggetti_ruolo.sql"
    - name: "mart_beneficiari_finanziamenti"
      sql: "sql/mart_beneficiari_finanziamenti.sql"
  validate:
    table_rules:
      mart_beneficiari:
        required_columns:
          - codice_fiscale
          - denominazione
          - n_progetti
          - n_progetti_beneficiario
        primary_key: [codice_fiscale]
        min_rows: 100000
      mart_soggetti_ruolo:
        required_columns: [ruolo, n_relazioni, n_soggetti]
        min_rows: 5
      mart_beneficiari_finanziamenti:
        required_columns:
          - codice_fiscale
          - n_progetti_beneficiario
          - finanz_ue_attribuito
        primary_key: [codice_fiscale]
        min_rows: 10000

validation:
  fail_on_error: true

support:
  - name: "progetti"
    config: "../opencoesione-progetti/dataset.yml"
    years: [2026]

