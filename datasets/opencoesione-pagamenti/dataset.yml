root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_pagamenti"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, pagamenti, flussi-cassa]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2007
    end_year: 2027

raw:
  sources:
    - name: "pagamenti_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/pagamenti_20260630.parquet"
        filename: "pagamenti.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - COD_LOCALE_PROGETTO
    - OC_DATA_PAGAMENTI
    - TOT_PAGAMENTI
  validate:
    not_null: [COD_LOCALE_PROGETTO]
    min_rows: 5000000

mart:
  tables:
    - name: "mart_flusso_cassa"
      sql: "sql/mart_flusso_cassa.sql"
    - name: "mart_pagamenti_programma"
      sql: "sql/mart_pagamenti_programma.sql"
    - name: "mart_pagamenti_avanzamento"
      sql: "sql/mart_pagamenti_avanzamento.sql"
  validate:
    table_rules:
      mart_flusso_cassa:
        required_columns: [anno, totale_pagamenti, n_progetti]
        min_rows: 10
      mart_pagamenti_avanzamento:
        required_columns: [ciclo, stato, anno, totale_pagamenti]
        min_rows: 20

validation:
  fail_on_error: true

support:
  - name: "progetti"
    config: "../opencoesione-progetti/dataset.yml"
    years: [2026]

