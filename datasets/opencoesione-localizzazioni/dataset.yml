root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_localizzazioni"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, localizzazioni, geolocalizzazione]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2007
    end_year: 2027

raw:
  sources:
    - name: "localizzazioni_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/localizzazioni_20260630.parquet"
        filename: "localizzazioni.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - COD_LOCALE_PROGETTO
    - DEN_REGIONE
    - DEN_PROVINCIA
    - DEN_COMUNE
  validate:
    not_null: [COD_LOCALE_PROGETTO]
    min_rows: 2000000

mart:
  tables:
    - name: "mart_territorio"
      sql: "sql/mart_territorio.sql"
    - name: "mart_aree_interne"
      sql: "sql/mart_aree_interne.sql"
    - name: "mart_regione_provincia"
      sql: "sql/mart_regione_provincia.sql"
    - name: "mart_comune_finanziamenti"
      sql: "sql/mart_comune_finanziamenti.sql"
    - name: "mart_territorio_finanziamenti"
      sql: "sql/mart_territorio_finanziamenti.sql"
  validate:
    table_rules:
      mart_territorio:
        required_columns: [regione, comune, n_progetti, n_localizzazioni]
        min_rows: 1000
      mart_aree_interne:
        required_columns: [cod_area_interna, classificazione, n_progetti]
        min_rows: 50
      mart_regione_provincia:
        required_columns: [regione, provincia, n_progetti]
        min_rows: 50
      mart_comune_finanziamenti:
        required_columns: [regione, comune, n_progetti, finanz_ue_attribuito]
        min_rows: 1000
      mart_territorio_finanziamenti:
        required_columns: [macroarea, ciclo, n_progetti, finanz_ue_tot]
        min_rows: 5

validation:
  fail_on_error: true

support:
  - name: "progetti"
    config: "../opencoesione-progetti/dataset.yml"
    years: [2026]

