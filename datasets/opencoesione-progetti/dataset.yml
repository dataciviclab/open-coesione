root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_progetti"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, progetti, storico, hub]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2000
    end_year: 2027

raw:
  sources:
    - name: "progetti_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/progetti_20260630.parquet"
        filename: "progetti.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - COD_LOCALE_PROGETTO
    - CUP
    - OC_TITOLO_PROGETTO
    - OC_COD_CICLO
    - OC_DESCR_CICLO
    - OC_TEMA_SINTETICO
    - OC_MACROAREA_PROGETTO
    - OC_STATO_PROGETTO
    - FINANZ_UE
    - OC_COSTO_COESIONE
    - TOT_PAGAMENTI
  validate:
    not_null: [COD_LOCALE_PROGETTO]
    min_rows: 2000000

mart:
  tables:
    - name: "mart_tema_ciclo"
      sql: "sql/mart_tema_ciclo.sql"
    - name: "mart_stato_ciclo"
      sql: "sql/mart_stato_ciclo.sql"
    - name: "mart_sll"
      sql: "sql/mart_sll.sql"
    - name: "mart_ciclo"
      sql: "sql/mart_ciclo.sql"
  validate:
    table_rules:
      mart_tema_ciclo:
        required_columns:
          - ciclo
          - tema
          - macroarea
          - n_progetti
          - finanz_ue_tot
          - costo_coesione
          - pagamenti_tot
        min_rows: 20
      mart_stato_ciclo:
        required_columns: [ciclo, stato, n_progetti, finanz_ue_tot]
        min_rows: 5
      mart_sll:
        required_columns: [cod_sll, sll, n_progetti, finanz_ue_tot]
        min_rows: 20
      mart_ciclo:
        required_columns: [ciclo, n_progetti, finanz_ue_tot, costo_coesione]
        min_rows: 3

validation:
  fail_on_error: true
