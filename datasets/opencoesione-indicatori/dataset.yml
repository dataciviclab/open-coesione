root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_indicatori"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, indicatori, valutazione]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2007
    end_year: 2027

raw:
  sources:
    - name: "indicatori_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/indicatori_20260630.parquet"
        filename: "indicatori.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - COD_LOCALE_PROGETTO
    - COD_INDICATORE
    - VALORE_PROGRAMMATO
    - VALORE_REALIZZATO
  validate:
    not_null: [COD_LOCALE_PROGETTO]
    min_rows: 3000000

mart:
  tables:
    - name: "mart_valutazione"
      sql: "sql/mart_valutazione.sql"
    - name: "mart_indicatori_tipo"
      sql: "sql/mart_indicatori_tipo.sql"

validation:
  fail_on_error: true
