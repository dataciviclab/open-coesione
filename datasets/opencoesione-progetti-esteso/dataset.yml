root: "../../out"
schema_version: 1

dataset:
  name: "opencoesione_progetti_esteso"
  source_id: "opencoesione"
  tags: [finanza-pubblica, opencoesione, progetti, esteso]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2027

raw:
  sources:
    - name: "progetti_esteso_parquet"
      type: "http_file"
      args:
        url: "https://opencoesione.gov.it/media/open_data/progetti_esteso_2021-2027_20260630.parquet"
        filename: "progetti_esteso_2021-2027.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - COD_LOCALE_PROGETTO
    - CUP
    - OC_TITOLO_PROGETTO
    - OC_COD_CICLO
    - OC_TEMA_SINTETICO
    - DEN_REGIONE
    - DEN_PROVINCIA
    - DEN_COMUNE
    - OC_CODICE_PROGRAMMA
    - OC_DESCRIZIONE_PROGRAMMA
  validate:
    not_null: [COD_LOCALE_PROGETTO]
    min_rows: 100000

mart:
  tables:
    - name: "mart_tema_ciclo"
      sql: "sql/mart_tema_ciclo.sql"
    - name: "mart_geolocalizzazione"
      sql: "sql/mart_geolocalizzazione.sql"
    - name: "mart_programmi"
      sql: "sql/mart_programmi.sql"
    - name: "mart_comune"
      sql: "sql/mart_comune.sql"
    - name: "mart_stato_tema"
      sql: "sql/mart_stato_tema.sql"
  validate:
    table_rules:
      mart_comune:
        required_columns: [regione, provincia, comune, n_progetti, finanz_ue_tot]
        min_rows: 100
      mart_stato_tema:
        required_columns: [tema, stato, n_progetti, finanz_ue_tot]
        min_rows: 5

validation:
  fail_on_error: true
